<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流萤桌宠</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Windows Desktop Pet</p>
        <h1>一只安静、轻量、会呼吸的 Q 版流萤</h1>
        <p class="lead">透明悬浮、托盘控制、关键帧动作和安静模式。不会追着鼠标乱跑，也不会在头顶说蠢话。</p>
        <div class="hero-actions">
          <a class="primary" href="../README.md">查看运行说明</a>
          <a class="ghost" href="../assets/manifest.json">素材清单</a>
        </div>
      </div>
      <div class="pet-card" aria-label="流萤桌宠预览">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <img src="流萤待机.png" alt="流萤桌宠形象">
      </div>
    </section>

    <section class="feature-grid" aria-label="功能亮点">
      <article>
        <span>01</span>
        <h2>低打扰互动</h2>
        <p>靠近、点击、拖拽、快速经过才会响应；安静模式下只保留呼吸和眨眼。</p>
      </article>
      <article>
        <span>02</span>
        <h2>关键帧缓动</h2>
        <p>用小幅缩放、位移和旋转塑造动作，不依赖视频或 GIF，体积和占用都更小。</p>
      </article>
      <article>
        <span>03</span>
        <h2>素材自由替换</h2>
        <p>PNG 文件名不固定，manifest 映射即可接入新动作图，适合继续扩展表情。</p>
      </article>
    </section>
  </main>
</body>
</html>
