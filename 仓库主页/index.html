<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流萤桌宠 - 治愈系桌面伴侣</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Windows Desktop Pet</p>
        <h1>一只安静、治愈、<br>会呼吸的 Q 版流萤</h1>
        <p class="lead">透明悬浮、托盘控制、灵动动作和安静模式。她会静静地待在你的屏幕角落，为你提供最温柔的陪伴。</p>
        <div class="hero-actions">
          <a class="primary" href="https://github.com/zhaowei666666/liuying-desktop-pet/releases">立即下载</a>
          <a class="ghost" href="https://github.com/zhaowei666666/liuying-desktop-pet">查看源码</a>
        </div>
      </div>
      <div class="pet-card" aria-label="流萤桌宠预览">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <img src="流萤待机.png" alt="流萤桌宠形象">
      </div>
    </section>

    <section class="feature-grid" aria-label="功能亮点">
      <article>
        <span>01</span>
        <h2>灵动互动</h2>
        <p>支持靠近、点击、拖拽多种反馈。采用关键帧缓动技术，让每一个动作都细腻自然。</p>
      </article>
      <article>
        <span>02</span>
        <h2>极低占用</h2>
        <p>基于原生 WPF 开发，内存占用极低。支持安静模式，在工作时绝不打扰你的思绪。</p>
      </article>
      <article>
        <span>03</span>
        <h2>时间感知</h2>
        <p>能够感知系统时间，在清晨、午后或深夜，流萤会展现出完全不同的心情和姿态。</p>
      </article>
    </section>
  </main>
</body>
</html>
